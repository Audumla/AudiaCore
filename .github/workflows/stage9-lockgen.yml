name: stage9-lockgen

on:
  push:
    branches:
      - 'stage9/application-assembly-impl'

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stage9/application-assembly-impl
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Generate locks
        shell: bash
        run: |
          cargo +1.95.0 generate-lockfile --manifest-path proofs/stage9/path-app/Cargo.toml
          cargo +1.95.0 generate-lockfile --manifest-path proofs/stage9/git-app/Cargo.toml
      - name: Commit locks
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proofs/stage9/path-app/Cargo.lock proofs/stage9/git-app/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Lock Stage 9 proof dependencies"
          git push origin HEAD:stage9/application-assembly-impl
