name: stage8-lockfile-proof

on:
  push:
    branches:
      - 'revalidation/stage8-cleanup-proof'

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1; proof branch only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Generate lockfile with Cargo
        shell: bash
        run: |
          cargo check --workspace
          echo 'LOCKFILE_BEGIN'
          cat Cargo.lock
          echo 'LOCKFILE_END'
