name: stage8-smoke-app

on:
  push:
    branches:
      - test/stage8-smoke-app
    paths:
      - examples/stage8-smoke-app/**
      - .github/workflows/stage8-smoke-app.yml
  pull_request:
    branches:
      - revalidation/foundation-layers
    paths:
      - examples/stage8-smoke-app/**
      - .github/workflows/stage8-smoke-app.yml

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Run Stage 8 smoke application
        shell: bash
        run: cargo +1.95.0 run --manifest-path examples/stage8-smoke-app/Cargo.toml
