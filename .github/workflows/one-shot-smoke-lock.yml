name: one-shot-smoke-lock

on:
  push:
    branches:
      - 'cleanup/main-hygiene-smoke'

permissions:
  contents: write

jobs:
  lock:
    if: github.event.head_commit.message != 'Generate smoke test lockfile'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Generate and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git rm .github/workflows/one-shot-smoke-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "Generate smoke test lockfile"
          git push origin HEAD:cleanup/main-hygiene-smoke
