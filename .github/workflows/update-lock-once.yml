name: update-lock-once

on:
  push:
    branches:
      - cleanup/post-stage8-slim

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Regenerate lockfile and remove one-shot workflow
        shell: bash
        run: |
          cargo generate-lockfile
          rm .github/workflows/update-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/update-lock-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate lockfile after Stage 8 cleanup"
            git push
          fi
