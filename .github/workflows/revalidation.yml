name: audiacore-revalidation

on:
  push:
    branches:
      - 'revalidation/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/architecture/**'
      - 'AGENTS.md'
      - '.github/workflows/revalidation.yml'

concurrency:
  group: audiacore-revalidation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Generate Stage 7 lockfile
        shell: bash
        run: cargo generate-lockfile
      - name: Format Stage 7 sources
        shell: bash
        run: cargo fmt --all
      - name: Revalidate foundation and capabilities
        shell: bash
        run: bash scripts/revalidate.sh
      - name: Revalidate Stage 7 application edge
        shell: bash
        run: bash scripts/revalidate-stage7.sh
      - name: Upload Stage 7 bootstrap
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: stage7-bootstrap
          path: |
            Cargo.lock
            crates/audiacore-application/src/lib.rs
            crates/audiacore-application/tests/stage7_proof.rs
