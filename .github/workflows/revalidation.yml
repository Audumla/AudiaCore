name: audiacore-revalidation

on:
  push:
    branches:
      - 'revalidation/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/architecture/**'
      - 'AGENTS.md'
      - '.github/workflows/revalidation.yml'

concurrency:
  group: audiacore-revalidation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1; immutable SHA required by dependency policy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce direct dependency admission
        shell: bash
        run: python scripts/check-dependency-admission.py
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Revalidate foundation and capabilities
        shell: bash
        run: bash scripts/revalidate.sh
      - name: Revalidate Stage 7 application edge
        shell: bash
        run: bash scripts/revalidate-stage7.sh
