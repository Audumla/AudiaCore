name: audiacore-revalidation

on:
  push:
    branches:
      - 'revalidation/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'examples/**'
      - 'scripts/revalidate.sh'
      - 'docs/architecture/**'
      - 'AGENTS.md'
      - '.github/workflows/revalidation.yml'

concurrency:
  group: audiacore-revalidation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Generate realignment lockfile
        shell: bash
        run: cargo generate-lockfile
      - name: Format realignment sources
        shell: bash
        run: cargo fmt --all
      - name: Revalidate current stage
        shell: bash
        run: bash scripts/revalidate.sh
      - name: Upload realignment bootstrap
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: configured-errors-bootstrap
          path: |
            Cargo.lock
            crates/audiacore-error-catalog/src/lib.rs
            crates/audiacore-error-catalog/tests/workspace_catalogues.rs
            crates/audiacore-template/src/lib.rs
