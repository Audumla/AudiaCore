name: tag-stage8-once

on:
  push:
    branches:
      - test/stage8-smoke-app
    paths:
      - .github/workflows/tag-stage8-once.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Create accepted Stage 8 tag
        shell: bash
        run: |
          set -euo pipefail
          tag="stage8-accepted"
          target="28ba554b1cd46bb56838ed5f9d9cc20a5881c391"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$target" -m "AudiaCore Stage 8 accepted"
          git push origin "refs/tags/$tag"
