VAL-EVENT-001:
  message: "Event identifier must not be empty."
  resolution: "Provide a non-empty event, stream, or causation identifier."
VAL-EVENT-002:
  message: "Event retention limit must be greater than zero."
  resolution: "Configure a positive retention limit or use an unbounded event policy."
VAL-EVENT-003:
  message: "Event page limit must be greater than zero."
  resolution: "Request at least one event per page."
CON-EVENT-001:
  message: "Event cursor has expired."
  resolution: "Restart from an available cursor or use durable storage when replay is required."
CON-EVENT-002:
  message: "Event cursor is ahead of the stream."
  resolution: "Use a cursor at or before the latest available event sequence."
RES-EVENT-001:
  message: "Event sequence space is exhausted."
  resolution: "Start a new event stream rather than allowing sequence identity to wrap."
