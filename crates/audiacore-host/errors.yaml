VAL-HOST-FILE-001:
  kind: validation
  message: "File authority root must be absolute."
  resolution: "Resolve the authority root to an absolute application-owned path before granting access."
VAL-HOST-PROCESS-001:
  kind: validation
  message: "Process program path must be absolute."
  resolution: "Resolve executable paths to absolute application-owned values before granting or requesting launch."
VAL-HOST-PROCESS-002:
  kind: validation
  message: "Process working directory must be absolute."
  resolution: "Resolve the child working directory to an absolute path before building the process request."
VAL-HOST-PROCESS-003:
  kind: validation
  message: "Process environment key must not be empty."
  resolution: "Provide a non-empty environment variable key."
