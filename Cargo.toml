[workspace]
members = [
    "crates/audiacore-core",
    "crates/audiacore-errors",
    "crates/audiacore-sensitive",
    "crates/audiacore-template",
    "crates/audiacore-error-catalog",
    "crates/audiacore-reconcile",
    "crates/audiacore-config",
    "crates/audiacore-host",
    "crates/audiacore-host-native",
    "crates/audiacore-events",
    "crates/audiacore-workflow",
    "crates/audiacore-time",
    "crates/audiacore-managed-config",
    "crates/audiacore-application",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

# Every direct third-party Rust dependency is approved here once. Member crates
# inherit these declarations instead of choosing independent version ranges.
# Cargo.lock remains the exact reproducible build lock.
[workspace.dependencies]
serde = "1.0.229"
serde_json = "1.0.151"
toml = { version = "1.1.4", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
yaml_serde = "0.10.7"
# Proof branch only: candidate for internal native filesystem containment.
cap-std = { version = "4.0.3", default-features = false }
